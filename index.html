<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Мой первый миллион</title>
<style>
:root{--bg:#FFF7E8;--card:#fff;--ink:#26283B;--mut:#7B7F98;--red:#E63946;--teal:#1F9E8F;--sun:#FFB703;--org:#F4842B;--line:#F1E3C8;--blue:#3A6EA5;--sh:0 4px 16px rgba(38,40,59,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.4}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 104px}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;margin:4px 0 10px}
h3{font-size:17px}
small{color:var(--mut)}
.sec{margin:20px 4px 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--teal);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.red{background:var(--red)}
.btn.sun{background:var(--sun);color:#3b2a00}
.btn.org{background:var(--org)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.wide{width:100%}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#FFF1D6;color:#9A5B00}
.tag.need{background:#DDF3EF;color:#0F6B60}.tag.want{background:#FFE3E5;color:#B42332}.tag.gift{background:#EDE6FF;color:#5B3DB5}.tag.grow{background:#E1ECFA;color:#2C5A8C}
.mut{color:var(--mut)}
.pos{color:var(--teal);font-weight:700}.neg{color:var(--red);font-weight:700}
.bar{height:10px;background:#F3EAD8;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--org));border-radius:99px}
.bar.teal>i{background:linear-gradient(90deg,#41C6B5,var(--teal))}
.bar.mood>i{background:linear-gradient(90deg,#FF8FA3,#FFB703,#41C6B5)}
/* hero */
.hero{text-align:center;padding:26px 10px 8px}
.logo{font-size:64px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero p{color:var(--mut);margin-top:8px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.pcard{background:#fff;border-radius:20px;padding:16px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pcard .av{font-size:44px}
.pcard.add{background:#FFF1D6}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 16px}
.avs button{font-size:30px;padding:8px 0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.avs button.on{box-shadow:inset 0 0 0 3px var(--teal);background:#E8F7F4}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none}
.inp:focus{border-color:var(--teal)}
/* top */
.top{background:linear-gradient(135deg,#E63946 0%,#F4842B 55%,#FFB703 100%);color:#fff;border-radius:24px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:16px solid rgba(255,255,255,.18)}
.top .av{font-size:42px;background:rgba(255,255,255,.25);width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.top small{color:rgba(255,255,255,.9)}
.cap{font-size:32px;font-weight:800;margin:10px 0 2px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:rgba(255,255,255,.22);padding:5px 10px;border-radius:99px;font-size:13px;font-weight:600}
.top .bar{background:rgba(255,255,255,.3)}.top .bar>i{background:#fff}
.goalm{margin-top:12px;font-size:13px}
/* event */
.evh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.big{font-size:42px}
.chs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ch{text-align:left;padding:13px 14px;border-radius:14px;background:#FFF7E8;box-shadow:inset 0 0 0 2px var(--line);font-weight:600}
.ch:active{background:#FFEBC4}
.ch.dis{opacity:.45}
.lesson{margin-top:10px;padding:12px 14px;border-radius:14px;background:#FFF1D6;font-size:15px}
.lesson.good{background:#DDF3EF}.lesson.bad{background:#FFE3E5}
.verdict{font-weight:800;margin-top:8px}
.ok{color:var(--teal)}.no{color:var(--red)}
.qopt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;margin-top:8px;background:#F4F7FB;box-shadow:inset 0 0 0 2px #E2E9F3;font-weight:600}
.qopt.right{background:#DDF3EF;box-shadow:inset 0 0 0 2px var(--teal)}
.qopt.wrong{background:#FFE3E5;box-shadow:inset 0 0 0 2px var(--red)}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.check{flex:1;min-width:96px;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:var(--sh);font-size:13px}
.check b{display:block;font-size:20px}
.endw{font-size:18px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#1F9E8F,#3A6EA5)}
/* items */
.item{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.item .e{font-size:36px}
.item .pr{font-weight:800;font-size:17px}
.old{text-decoration:line-through;color:var(--mut);font-weight:400;font-size:13px;margin-left:4px}
.sale{background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:99px}
.chore{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh);text-align:left;display:flex;gap:10px;align-items:center}
.chore .e{font-size:30px}
.chore.done{opacity:.5;background:#EFF7F5}
.chore b{display:block}
.banner{background:linear-gradient(135deg,#FFE3E5,#FFF1D6);border-radius:18px;padding:14px;margin-bottom:14px}
.info{background:#E1ECFA;border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px;color:#22476F}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:14px}
.seg button.on{background:var(--teal);color:#fff;box-shadow:none}
.lock{opacity:.55}
/* ach */
.ach{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--sh);font-size:12px}
.ach .e{font-size:32px;display:block}
.ach b{display:block;font-size:13px;margin:2px 0}
.ach.off{filter:grayscale(1);opacity:.4}
.logl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stat{background:#FFF7E8;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{font-size:12px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.08);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .in{display:flex;max-width:760px;width:100%;justify-content:space-between}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--mut);padding:4px 0;border-radius:12px;position:relative;min-width:0}
.nav button span{font-size:22px;line-height:1.2}
.nav button.on{color:var(--red);background:#FFF1D6}
.dot{position:absolute;top:2px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(38,40,59,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
@media(min-width:620px){.ov{align-items:center;padding:20px}}
.md{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@media(min-width:620px){.md{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.md h2{margin-top:0}
.rl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;z-index:80;font-weight:600;box-shadow:var(--sh);max-width:92vw;text-align:center;animation:up .2s}
.celebrate{text-align:center}
.celebrate .e{font-size:72px;display:block;animation:bob 1.5s infinite}
.pin{letter-spacing:.5em;text-align:center;font-size:26px}
textarea.inp{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.pk{border-left:5px solid var(--teal)}
.spark{width:100%;height:60px;display:block;margin-top:6px}
.snd{position:absolute;top:12px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.28);font-size:22px;display:flex;align-items:center;justify-content:center}
.snd.off{opacity:.75}
.snd2{position:fixed;top:12px;right:12px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:22px;z-index:10}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sw{width:52px;height:30px;border-radius:99px;background:#D9D3C6;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--teal)}.sw.on:after{left:25px}
.mel{background:#FFF7E8;border-radius:16px;padding:10px;text-align:left;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;gap:2px}
.mel .e{font-size:26px}.mel small{font-size:12px}
.mel.on{background:#DDF3EF;box-shadow:inset 0 0 0 3px var(--teal)}
.bklist{display:flex;flex-direction:column;gap:10px}
.bkitem{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);text-align:left;border-left:6px solid var(--c)}
.bkitem b{display:block;font-size:16px}.bkitem small{font-size:12px}
.bke{font-size:30px;width:44px;text-align:center}
.bkhead{background:var(--c);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.bkhead span{font-size:52px;display:block;line-height:1.1}.bkhead small{color:rgba(255,255,255,.9)}.bkhead h2{margin:2px 0 0;color:#fff}
.page{font-size:17px;line-height:1.6}.page>p{margin:0 0 12px}
.bkbox{border-radius:16px;padding:12px 14px;margin:0 0 12px}.bkbox p{margin-top:4px}
.bkbox.fact{background:#FFF1D6}.bkbox.ex{background:#E1ECFA}.bkbox.key{background:#DDF3EF;border:2px dashed var(--teal)}
.bkhtml{margin:4px 0 14px}
.bk3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bk3 div{background:#FFF7E8;border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.3}.bk3 span{font-size:30px;display:block}.bk3 b{display:block;margin:4px 0}
.bkpath{display:flex;align-items:center;justify-content:space-between;background:#FFF7E8;border-radius:14px;padding:10px 6px;font-size:28px;text-align:center}.bkpath small{display:block;font-size:11px;color:var(--mut)}.bkpath i{font-style:normal;color:var(--mut);font-size:18px}
.bkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bkgrid div{background:#FFF7E8;border-radius:14px;padding:10px 4px;text-align:center;font-size:26px}.bkgrid b{display:block;font-size:13px;margin-top:2px}
.bk2{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:15px;line-height:1.7}.bk2 div{border-radius:14px;padding:10px 12px}.bk2 b{display:block;margin-bottom:4px}.bk2 .g{background:#DDF3EF}.bk2 .r{background:#FFE3E5}
.bkpie{display:flex;gap:16px;align-items:center;background:#FFF7E8;border-radius:14px;padding:12px}.bkpie .pie{width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(#F4842B 0 60%,#1F9E8F 60% 90%,#E63946 90% 100%)}.bkpie p{margin:4px 0;font-size:15px}.bkpie i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.bksteps{display:flex;flex-direction:column;gap:8px}.bksteps div{background:#FFF7E8;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:15px}.bksteps b{background:var(--teal);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none}
.bkflow{display:flex;align-items:center;justify-content:space-between;background:#FFF7E8;border-radius:14px;padding:10px;font-size:30px;text-align:center}.bkflow small{display:block;font-size:11px;color:var(--mut)}.bkflow i{font-style:normal;font-size:18px;color:var(--teal)}
.bkcap{font-size:13px;color:var(--mut);margin-top:6px;text-align:center}
.bktab{width:100%;border-collapse:collapse;font-size:15px}.bktab th,.bktab td{padding:7px 10px;border-bottom:1px dashed var(--line);text-align:left}.bktab th{color:var(--mut);font-weight:600}.bktab td:last-child,.bktab th:last-child{text-align:right}
.bkformula{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:#FFF7E8;border-radius:14px;padding:12px;font-weight:700;font-size:15px}.bkformula span{background:#fff;padding:8px 10px;border-radius:12px}.bkformula span.g{background:#DDF3EF}.bkformula i{font-style:normal;font-size:20px}
.bkflags p{background:#FFE3E5;border-radius:12px;padding:8px 12px;margin:0 0 6px;font-size:15px}
.bkrisk{display:flex;flex-direction:column;gap:8px}.bkrisk div{width:var(--w);min-width:62%;background:var(--c);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}.bkrisk small{display:block;color:rgba(255,255,255,.9);font-weight:400;font-size:12px}
.bkq{margin-bottom:14px}.bkq>b{display:block;margin:8px 0 2px}
input[type=range]{width:100%;accent-color:var(--teal)}
</style>
</head>

/* ---------- Ситуации после первого миллиона ---------- */
function auditOf(p){return Math.max(50000,Math.round(Math.max(p.lastBizP,0)*0.15));}
function insOf(p){return Math.max(20000,Math.round(p.biz.reduce((s,b)=>s+b.inv,0)*0.01));}
function dmgOf(p){return Math.max(100000,Math.round(p.biz.reduce((s,b)=>s+b.inv,0)*0.05));}
function staffOf(p){return Math.max(50000,Math.round(Math.max(p.lastBizP,0)*0.5));}

/* ---------- Третья глава: после 20 000 000 сом — налоги, штрафы, санкции ---------- */
const BIG_GOAL=20000000;
const TAX={profit:0.10,social:0.03,prop:0.0002,peni:0.01,over:0.08};
function bigScale(p){return Math.max(500000,Math.round(Math.max(p.lastBizP,0)));}
function ownedOf(p,ids){const b=p.biz.find(x=>ids.includes(x.id));return b||p.biz.slice().sort((a,b)=>(b.last||0)-(a.last||0))[0];}
function suspendBiz(p,ids,weeks,why){
  const b=ownedOf(p,ids);if(!b)return '';
  p.susp=(p.susp||[]).filter(s=>s.id!==b.id);p.susp.push({id:b.id,until:p.week+weeks,why});
  addLog(p,'⛔ Приостановлен бизнес «'+BIZM[b.id][2]+'» на '+weeks+' нед.: '+why,0);
  return '⛔ «'+BIZM[b.id][2]+'» приостановлен на '+weeks+' нед. Пока он закрыт, прибыли нет.';
}
function freeze(p,a,weeks,why){
  let need=a;const fb=Math.min(p.bank,need);p.bank-=fb;need-=fb;const fc=Math.min(p.cash,need);p.cash-=fc;need-=fc;
  const got=a-need;if(got<=0)return '';
  (p.frozen=p.frozen||[]).push({a:got,until:p.week+weeks,why});
  addLog(p,'🧊 Заморожено на счёте '+fmt(got)+' на '+weeks+' нед.: '+why,0);
  return '🧊 Банк заморозил '+fmt(got)+' на '+weeks+' нед. Эти деньги твои, но тратить их нельзя.';
}
function addTaxDebt(p,a,why){
  if(!p.taxdebt)p.taxdebt={a:0,w:0,why};
  p.taxdebt.a+=a;p.taxdebt.why=why;addLog(p,'🧾 Налоговый долг: '+why,0);
  return '🧾 Появился налоговый долг '+fmt(a)+'. Пока он не погашен, каждую неделю начисляются пени 1%.';
}
function fine(p,a,why){payMust(p,a,'⚖️ Штраф: '+why);p.st.fines=(p.st.fines||0)+a;return '⚖️ Штраф '+fmt(a)+'.';}
function payDebt(){
  const p=P();if(!p.taxdebt)return;
  const a=p.taxdebt.a;
  if(p.cash+p.bank<a){toast('Не хватает денег на счёте и в кошельке');return;}
  payMust(p,a,'🧾 Погашен налоговый долг');p.taxdebt=null;addXp(p,20);p.st.wise++;
  toast('Долг погашен — пени больше не начисляются ✅');sfx('good');save();render();
}
function frozenSum(p){return (p.frozen||[]).reduce((s,f)=>s+f.a,0);}
function isSusp(p,id){return (p.susp||[]).find(s=>s.id===id&&s.until>p.week);}

/* =================== УТИЛИТЫ =================== */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')+' сом';}
function sgn(n){return (n>0?'+':n<0?'−':'')+fmt(Math.abs(n));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function uid(){return Math.random().toString(36).slice(2,9);}
function P(){return S.profiles[S.cur];}
function lvl(p){let i=0;LEVELS.forEach((l,k)=>{if(p.xp>=l[0])i=k;});return i;}
function nw(p){return Math.round(p.cash+p.bank+frozenSum(p)-(p.taxdebt?p.taxdebt.a:0)+p.deps.reduce((s,d)=>s+d.a,0)+p.goals.reduce((s,g)=>s+(g.done?0:g.saved),0)+p.biz.reduce((s,b)=>s+b.inv*BIZ_SELL,0)-(p.loan?p.loan.left*p.loan.pay:0));}
function goalsSum(p){return p.goals.reduce((s,g)=>s+(g.done?0:g.saved),0);}
function depSum(p){return p.deps.reduce((s,d)=>s+d.a,0);}

function newProfile(name,av){
  const p={id:uid(),name,av,week:1,cash:START_CASH,bank:0,deps:[],goals:[],biz:[],inv:[],mood:70,xp:0,ach:[],log:[],
    chores:[],quiz:null,ev:null,pend:[],loan:null,auto:0,pocket:300,ptasks:[],hist:[START_CASH],recent:[],qseen:[],disc:null,boost:1,lastBizP:0,
    st:{wise:0,unwise:0,imp:0,resist:0,qc:0,qt:0,ch:0,earned:0,spent:0,interest:0,bizp:0,scam:0,real:0},fl:{},created:Date.now()};
  startWeek(p);
  addLog(p,'🎉 Начало игры. Стартовый капитал',START_CASH);
  return p;
}
function addLog(p,t,a){p.log.unshift({w:p.week,t,a:a||0});if(p.log.length>200)p.log.length=200;}
function earn(p,a,t){p.cash+=a;p.st.earned+=a;addLog(p,t,a);}
function spend(p,a,t){p.cash-=a;p.st.spent+=a;addLog(p,t,-a);}
function spendQuiet(p,a){p.cash-=a;p.st.spent+=a;}
function moodAdd(p,d){p.mood=Math.max(0,Math.min(100,p.mood+d));}
function addXp(p,x){const before=lvl(p);p.xp+=x;const after=lvl(p);if(after>before)setTimeout(()=>levelUp(after),350);}
function addToSaving(p,a){const g=p.goals.find(x=>!x.done);if(g)g.saved+=a;else p.bank+=a;}
/* обязательный расход: сначала наличные, потом банк, потом копилки */
function payMust(p,a,t){
  let need=a;const take=Math.min(p.cash,need);p.cash-=take;need-=take;
  if(need>0){const b=Math.min(p.bank,need);p.bank-=b;need-=b;}
  for(const g of p.goals){if(need<=0)break;if(g.done)continue;const x=Math.min(g.saved,need);g.saved-=x;need-=x;}
  p.st.spent+=a-need;addLog(p,t,-(a-need));
  if(need>0){moodAdd(p,-10);addLog(p,'⚠️ Не хватило денег, родители помогли. Нужна подушка безопасности!',0);return false;}
  return true;
}

function pickEvent(p){
  const tier=p.fl.big&&Math.random()<0.85?'big':p.fl.mill?'rich':'base';
  const pool=EVENTS.filter(e=>(e.big?'big':e.rich?'rich':'base')===tier&&(!e.cond||e.cond(p)));
  let el=pool.filter(e=>!p.recent.slice(-Math.min(10,pool.length-3)).includes(e.id));
  if(!el.length)el=pool;
  const e=pick(el);p.recent.push(e.id);if(p.recent.length>10)p.recent.shift();return e.id;
}
function pickQuiz(p){
  let pool=QUIZ.map((q,i)=>i).filter(i=>!p.qseen.includes(i));
  if(!pool.length){p.qseen=[];pool=QUIZ.map((q,i)=>i);}
  const i=pick(pool);p.qseen.push(i);return i;
}
function startWeek(p){
  p.chores=[];
  p.quiz={i:pickQuiz(p),ans:null};
  p.ev={id:pickEvent(p),done:false,res:null};
  const it=pick(SHOP.filter(x=>x[3]>=400));
  p.disc={id:it[0],pct:pick([20,25,30,40])};
}
function price(p,it){return p.disc&&p.disc.id===it[0]?Math.round(it[3]*(100-p.disc.pct)/100):it[3];}

function endWeek(){
  const p=P();
  if(p.ev&&!p.ev.done){toast('Сначала реши ситуацию недели ☝️');TAB='home';render();return;}
  const R=[];const nw0=nw(p);
  // карманные деньги + автокопилка
  if(p.pocket>0){
    earn(p,p.pocket,'💵 Карманные деньги');R.push(['💵 Карманные деньги',p.pocket]);
    const s=Math.round(p.pocket*p.auto/100);
    if(s>0){p.cash-=s;addToSaving(p,s);R.push(['🐷 Автокопилка отложила',s,'save']);}
  }
  // бизнесы
  if(p.biz.length){
    let bt=0;
    p.biz.forEach(b=>{const d=BIZM[b.id];let pr;
      const su=isSusp(p,b.id);
      if(su){pr=0;b.bad='⛔ приостановлен: '+su.why;}
      else if(Math.random()<0.1){pr=-Math.round(d[3]*0.03);b.bad=pick(BADS);}
      else{pr=Math.round(rnd(d[4],d[5])*(1+BIZ_UP*(b.lv-1))*p.boost*(p.mult||1));b.bad=null;}
      b.last=pr;b.total+=pr;b.weeks++;bt+=pr;
      R.push([d[1]+' '+d[2]+(b.bad?' — '+b.bad:''),pr]);});
    p.st.bizp+=bt;p.lastBizP=bt;
    if(bt>=0)earn(p,bt,'🏪 Прибыль бизнеса');else payMust(p,-bt,'🏪 Убыток бизнеса');
    if(p.fl.big){
      const inv=p.biz.reduce((s,b)=>s+b.inv,0);
      const tx=[['🏢 Расходы большой компании (аренда, охрана, бухгалтерия, управленцы)',Math.round(inv*TAX.over)],['🧾 Налог на прибыль (10%)',Math.round(Math.max(bt,0)*TAX.profit)],['👷 Взносы в Соцфонд за работников',Math.round(Math.max(bt,0)*TAX.social)],['🏠 Налог на имущество',Math.round(inv*TAX.prop)]];
      tx.forEach(([t,a])=>{if(a>0){payMust(p,a,t);R.push([t,-a]);p.st.taxes=(p.st.taxes||0)+a;}});
    }
  }else p.lastBizP=0;
  p.boost=1;
  // проценты
  if(p.week%4===0&&p.bank>0){const i=Math.round(p.bank*SAVE_RATE);if(i>0){p.bank+=i;p.st.interest+=i;addLog(p,'💹 Проценты по накопительному счёту',i);R.push(['💹 Проценты на счёте',i]);}}
  p.deps.forEach(d=>d.left--);
  p.deps.filter(d=>d.left<=0).forEach(d=>{const i=Math.round(d.a*d.r);p.cash+=d.a+i;p.st.interest+=i;addLog(p,'🔓 Вклад закрыт: '+fmt(d.a)+' + проценты',i);R.push(['🔓 Вклад вернулся с процентами',d.a+i]);});
  p.deps=p.deps.filter(d=>d.left>0);
  // кредит
  if(p.loan){payMust(p,p.loan.pay,'💸 Платёж по микрозайму');R.push(['💸 Платёж по микрозайму',-p.loan.pay]);p.loan.left--;if(p.loan.left<=0){p.loan=null;R.push(['✅ Микрозайм погашен',0]);}}
  // отложенные события
  p.pend.filter(x=>x.w<=p.week).forEach(x=>{
    if(x.fx&&LATER[x.fx]){addLog(p,x.t,0);R.push([x.t,0]);const r=LATER[x.fx](p,x.v);if(r)R.push([plain(r),0]);return;}
    if(x.a>0)earn(p,x.a,x.t);else if(x.a<0)payMust(p,-x.a,x.t);else addLog(p,x.t,0);R.push([x.t,x.a]);});
  // замороженные деньги, приостановки, пени
  (p.frozen||[]).filter(f=>f.until<=p.week+1).forEach(f=>{p.bank+=f.a;addLog(p,'🔓 Счёт разморожен: '+fmt(f.a),0);R.push(['🔓 Разморожены деньги на счёте',f.a]);});
  if(p.frozen)p.frozen=p.frozen.filter(f=>f.until>p.week+1);
  if(p.susp)p.susp=p.susp.filter(s=>s.until>p.week+1);
  if(p.taxdebt){
    const pe=Math.max(1,Math.round(p.taxdebt.a*TAX.peni));p.taxdebt.a+=pe;p.taxdebt.w++;R.push(['⏳ Пени по налоговому долгу (1%)',-pe]);
    if(p.taxdebt.w>=6){const a=p.taxdebt.a;payMust(p,a,'🧾 Принудительное взыскание налогового долга');R.push(['🧾 Налоговая списала долг принудительно',-a]);
      const r=freeze(p,Math.round(p.bank*0.3),3,'неуплата налога');if(r)R.push([plain(r),0]);p.taxdebt=null;}
  }
  p.pend=p.pend.filter(x=>x.w>p.week);
  // настроение
  moodAdd(p,-5);
  p.week++;
  p.hist.push(nw(p));if(p.hist.length>260)p.hist.shift();
  startWeek(p);
  save();
  sfx('week');weekReport(p,R,nw0);
  checkAch(p);
}
const BIZM=Object.fromEntries(BIZ.map(b=>[b[0],b]));

/* =================== ДЕЙСТВИЯ =================== */
function choose(i){
  const p=P(),e=EVM[p.ev.id],c=e.ch[i];
  if(p.ev.done)return;
  const M=cm(c,p),label=ct(c,p);
  if(M<0&&!c.must&&p.cash<-M){toast('Не хватает наличных 😕');return;}
  const msg=[];
  if(M>0)earn(p,M,e.e+' '+e.title);
  else if(M<0){if(c.must)payMust(p,-M,e.e+' '+e.title);else spend(p,-M,e.e+' '+e.title);}
  if(c.mood)moodAdd(p,c.mood);
  if(c.w===true)p.st.wise++;if(c.w===false)p.st.unwise++;
  if(c.imp)p.st.imp++;
  if(c.flag==='resist')p.st.resist++;
  if(c.flag==='scam')p.st.scam++;
  if(c.flag)p.fl[c.flag]=1;
  addXp(p,(c.xp||0)+5);
  if(c.fx){const r=c.fx(p);if(r)msg.push(r);}
  p.ev.done=true;p.ev.res={c:i,t:label,msg:msg.join(' ')};
  sfx(c.w===true?'good':c.w===false?'bad':'coin');
  save();render();checkAch(p);
}
function answer(k){
  const p=P();if(p.quiz.ans!==null)return;
  const q=QUIZ[p.quiz.i];p.quiz.ans=k;p.st.qt++;
  sfx(k===q[2]?'good':'bad');
  if(k===q[2]){p.st.qc++;addXp(p,20);earn(p,50,'🧠 Правильный ответ на вопрос недели');toast('Верно! +50 сом и +20 опыта');}
  else{addXp(p,5);}
  save();render();checkAch(p);
}
function doChore(id){
  const p=P();
  if(p.chores.includes(id))return;
  if(p.chores.length>=MAX_CHORES){toast('На этой неделе сил больше нет: максимум '+MAX_CHORES+' дела');return;}
  const c=CHORES.find(x=>x[0]===id);
  const k=p.mood<30?0.7:1;const pay=Math.round(c[3]*k);
  sfx('coin');p.chores.push(id);earn(p,pay,c[1]+' '+c[2]);p.st.ch++;addXp(p,5);
  toast('+'+fmt(pay)+(k<1?' (настроение низкое — заработок меньше)':''));
  save();render();checkAch(p);
}

/* =================== ДОСТИЖЕНИЯ =================== */
function checkAch(p){
  if(nw(p)>=1e6)p.fl.mill=1;
  if(nw(p)>=BIG_GOAL)p.fl.big=1;
  const got=[];
  ACH.forEach(a=>{if(!p.ach.includes(a[0])&&a[4](p)){p.ach.push(a[0]);got.push(a);p.xp+=25;}});
  if(!got.length)return;
  save();
  if(got.some(a=>a[0]==='m50')){summit(p);return;}
  if(got.some(a=>a[0]==='m20')){bigModal(p);return;}
  if(got.some(a=>a[0]==='m1')){million(p);return;}
  sfx('win');got.forEach((a,k)=>setTimeout(()=>toast(a[1]+' Достижение: '+a[2]+' (+25 опыта)'),k*1800+200));

function audioInit(){
  if(SND.ctx)return true;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{SND.ctx=new AC();}catch(e){return false;}
  const c=SND.ctx;
  SND.master=c.createGain();SND.master.gain.value=S.sound.vol/100;
  SND.mus=c.createGain();SND.mus.gain.value=0;
  SND.fx=c.createGain();SND.fx.gain.value=1.1;
  // мягкая «комната» (реверберация)
  const len=Math.floor(c.sampleRate*2.4),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const rev=c.createConvolver();rev.buffer=buf;const wet=c.createGain();wet.gain.value=0.4;
  SND.mus.connect(SND.master);SND.mus.connect(rev);rev.connect(wet);wet.connect(SND.master);
  SND.fx.connect(SND.master);SND.master.connect(c.destination);
  return true;
}

function tone(f,t,d,type,g,att,lp,dest){

function inst(k,f,t){

function playStep(s,t){
  const X=sty(),bar=Math.floor(s/8),st=s%8,ch=X.prog[bar%4],phrase=Math.floor(bar/4)%4,beat=60/X.bpm/2;
  if(X.pad==='long'&&st===0)ch[0].forEach(n=>tone(mtof(n),t,beat*8+1.6,'triangle',X.padG,0.6,1000));
  if(X.pad==='stab'&&(st===2||st===6))ch[0].forEach(n=>tone(mtof(n),t,beat*1.1,'triangle',X.padG,0.01,1800));
  if(X.pad==='arp')tone(mtof(ch[0][[0,1,2,1][st%4]]-12),t,beat*0.9,'square',X.padG,0.005,800);
  const bp=X.bass[phrase%2];
  if(bp[st]!==null){let k=st+1;while(k<8&&bp[k]===null)k++;tone(mtof(ch[1]+bp[st]),t,beat*(k-st)*0.95,X.bassT,X.bassG,0.02,500);}
  if(st===0)MUS.pat=pick(X.pats);

  if(!MUS.pat||!MUS.pat[st])return;
  const sc=X.scale;
  MUS.mi=Math.max(0,Math.min(sc.length-1,MUS.mi+pick([-2,-1,-1,0,1,1,2])));
  if(st===0||st===4){let best=MUS.mi,bd=99;sc.forEach((n,i)=>{if(ch[2].includes(n%12)&&Math.abs(i-MUS.mi)<bd){bd=Math.abs(i-MUS.mi);best=i;}});MUS.mi=best;}
  inst(X.inst,mtof(sc[MUS.mi]),t);
}

const BOOK_REWARD = {xp:30, som:100};

let BK=null, BQ={}, SPEAK=false;
function bookDone(p){return p&&p.book?Object.keys(p.book).length:0;}
function openCh(i){stopSpeak();BK=i;BQ={};window.scrollTo(0,0);render();}
function closeCh(){stopSpeak();BK=null;window.scrollTo(0,0);render();}
function openBook(){BK=null;if(VIEW==='game')tab('book');else go('book');}

function bAnswer(qi,k){
  const ch=BOOK[BK],q=ch.q[qi];
  if(BQ[qi]===q[2])return;
  BQ[qi]=k;sfx(k===q[2]?'good':'bad');
  const p=VIEW==='game'?P():null;
  if(p&&ch.q.every((qq,j)=>BQ[j]===qq[2])&&!(p.book&&p.book[ch.id])){
    p.book=p.book||{};p.book[ch.id]=1;
    addXp(p,BOOK_REWARD.xp);earn(p,BOOK_REWARD.som,'📖 Прочитана глава «'+ch.title+'»');
    save();setTimeout(()=>toast('📖 Глава пройдена! +'+BOOK_REWARD.som+' сом и +'+BOOK_REWARD.xp+' опыта'),300);
    checkAch(p);
  }
  render();
}

/* чтение вслух (Web Speech API) */
function plain(s){return String(s).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim();}
function duck(on){if(SND.mus&&SND.ctx&&SND.playing)SND.mus.gain.setTargetAtTime(on?0.15:0.85,SND.ctx.currentTime,0.3);}
function stopSpeak(){if(SPEAK&&'speechSynthesis' in window)speechSynthesis.cancel();if(SPEAK){SPEAK=false;duck(false);}}
function speakCh(){
  if(!('speechSynthesis' in window)){toast('На этом устройстве нет чтения вслух');return;}
  if(SPEAK){stopSpeak();render();return;}
  const ch=BOOK[BK];
  const lab={fact:'Интересный факт. ',ex:'Пример. ',key:'Запомни! '};
  const parts=[ch.title].concat(ch.b.map(b=>(lab[b.t]||'')+plain(b.s||b.x)));
  const voices=speechSynthesis.getVoices();const v=voices.find(x=>/^ru/i.test(x.lang));
  speechSynthesis.cancel();SPEAK=true;duck(true);
  parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=0.92;if(v)u.voice=v;
    if(i===parts.length-1)u.onend=()=>{SPEAK=false;duck(false);render();};
    u.onerror=()=>{if(SPEAK){SPEAK=false;duck(false);render();}};
    speechSynthesis.speak(u);});
  render();
}

function vBook(p){
  if(BK!==null)return vChapter(p);
  const n=bookDone(p);
  return `<h2>📖 Книга о деньгах</h2>
  <div class="info">${p?`Прочитай главу и ответь на 2 вопроса в конце — получишь <b>+${BOOK_REWARD.som} сом</b> и <b>+${BOOK_REWARD.xp} опыта</b>. Пройдено: <b>${n} из ${BOOK.length}</b>`:'Читай главы по порядку или выбирай интересные. Чтобы получать награды за главы, войди в игру под своим именем.'}</div>
  ${p?`<div class="bar teal" style="margin:-4px 0 14px"><i style="width:${Math.round(n/BOOK.length*100)}%"></i></div>`:''}
  <div class="bklist">${BOOK.map((ch,i)=>{const d=p&&p.book&&p.book[ch.id];return `<button class="bkitem" onclick="openCh(${i})" style="--c:${ch.c}"><span class="bke">${ch.e}</span><span style="flex:1"><small>Глава ${i+1}</small><b>${ch.title}</b></span><span>${d?'✅':'›'}</span></button>`;}).join('')}</div>`;
}
function vChapter(p){
  const ch=BOOK[BK],d=p&&p.book&&p.book[ch.id];
  const lab={fact:'🤓 Интересный факт',ex:'🧮 Пример',key:'📌 Запомни'};
  const blocks=ch.b.map(b=>b.t==='p'?`<p>${b.x}</p>`:b.t==='html'?`<div class="bkhtml">${b.x}</div>`:`<div class="bkbox ${b.t}"><b>${lab[b.t]}</b><p>${b.x}</p></div>`).join('');
  const qs=ch.q.map((q,qi)=>{const a=BQ[qi];return `<div class="bkq"><b>${qi+1}. ${q[0]}</b>${q[1].map((o,k)=>`<button class="qopt ${a!==undefined&&k===q[2]&&a===q[2]?'right':''} ${a===k&&k!==q[2]?'wrong':''}" onclick="bAnswer(${qi},${k})">${o}</button>`).join('')}${a!==undefined?(a===q[2]?`<p class="verdict ok">✅ Верно! <small>${q[3]}</small></p>`:'<p class="verdict no">❌ Подумай ещё — попробуй другой ответ</p>'):''}</div>`;}).join('');
  return `<div class="row between" style="margin-bottom:10px"><button class="btn sm ghost" onclick="closeCh()">← Оглавление</button><button class="btn sm ${SPEAK?'red':'sun'}" onclick="speakCh()">${SPEAK?'⏹ Стоп':'🔊 Слушать'}</button></div>
  <div class="bkhead" style="--c:${ch.c}"><span>${ch.e}</span><small>Глава ${BK+1} из ${BOOK.length}</small><h2>${ch.title}</h2></div>
  <div class="card page">${blocks}</div>
  <div class="card"><h3>🧠 Проверь себя ${d?'<span class="tag need">✅ пройдено</span>':p?`<span class="tag">+${BOOK_REWARD.som} сом</span>`:''}</h3>${qs}</div>
  <div class="row" style="gap:10px">${BK>0?`<button class="btn ghost" style="flex:1" onclick="openCh(${BK-1})">← Назад</button>`:''}${BK<BOOK.length-1?`<button class="btn" style="flex:1" onclick="openCh(${BK+1})">Дальше →</button>`:`<button class="btn" style="flex:1" onclick="closeCh()">К оглавлению</button>`}</div>`;
}

/* =================== ОТЧЁТ И РОДИТЕЛИ =================== */
function summ(p){return {id:p.id,n:p.name,a:p.av,w:p.week,nw:nw(p),xp:p.xp,cash:p.cash,bank:p.bank+depSum(p),st:p.st,ach:p.ach.slice(),biz:p.biz.map(b=>[BIZM[b.id][1],BIZM[b.id][2],b.lv]),
  goals:p.goals.map(g=>[g.e,g.n,g.saved,g.target,g.done?1:0]),bk:bookDone(p),h:p.hist.slice(-52),log:p.log.slice(0,12),loan:p.loan?p.loan.left*p.loan.pay:0,mood:p.mood,t:Date.now()};}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function showReport(){
  const code='МПМ:'+b64e(JSON.stringify(summ(P())));
  modal(`<h2>📤 Отчёт для родителей</h2><p class="mut" style="margin-bottom:10px">Скопируй код и отправь родителю в WhatsApp или Telegram. Родитель вставит его в родительском кабинете.</p>
  <textarea id="rc" class="inp" readonly>${code}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="copyCode()">📋 Скопировать</button>${navigator.share?'<button class="btn sun" style="flex:1" onclick="shareCode()">📲 Поделиться</button>':''}</div>
  <button class="btn ghost wide" style="margin-top:10px" onclick="closeModal()">Закрыть</button>`);
}
function copyCode(){const t=$('rc');t.select();t.setSelectionRange(0,1e6);let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано ✅'),()=>toast(ok?'Скопировано ✅':'Выдели текст и скопируй вручную'));else toast(ok?'Скопировано ✅':'Выдели текст и скопируй вручную');}
function shareCode(){navigator.share({title:'Мой первый миллион — отчёт',text:$('rc').value}).catch(()=>{});}

function parentEnter(){
  if(!S.parent.pin){modal(`<h2>👨‍👩‍👧 Родительский кабинет</h2><p class="mut">Придумайте PIN-код из 4 цифр, чтобы дети не заходили сюда.</p><input id="pin" class="inp pin" type="password" inputmode="numeric" maxlength="4" style="margin:14px 0"><button class="btn wide" onclick="setPin()">Сохранить</button>`);return;}
  modal(`<h2>👨‍👩‍👧 Родительский кабинет</h2><p class="mut">Введите PIN-код</p><input id="pin" class="inp pin" type="password" inputmode="numeric" maxlength="4" style="margin:14px 0" onkeyup="if(this.value.length===4)checkPin()"><button class="btn wide" onclick="checkPin()">Войти</button>`);
  setTimeout(()=>{const i=$('pin');if(i)i.focus();},50);
}
function setPin(){const v=$('pin').value;if(!/^\d{4}$/.test(v)){toast('Нужно ровно 4 цифры');return;}S.parent.pin=v;save();closeModal();PARENT_OK=true;go('parent');}
function checkPin(){if($('pin').value===S.parent.pin){closeModal();PARENT_OK=true;go('parent');}else toast('Неверный PIN');}
function spark(h){
  if(!h||h.length<2)return '';
  const mx=Math.max(...h),mn=Math.min(...h),W=300,H=60,r=mx-mn||1;
  const pts=h.map((v,i)=>(i/(h.length-1)*W).toFixed(1)+','+(H-4-(v-mn)/r*(H-8)).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#1F9E8F" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function pCard(s,p){
  const st=s.st,wp=wisePct(st),tot=st.wise+st.unwise;
  const L=(()=>{let i=0;LEVELS.forEach((l,k)=>{if(s.xp>=l[0])i=k;});return i;})();
  const flags=[];
  if(st.imp>=3)flags.push('🛍 Частые импульсивные покупки ('+st.imp+') — стоит обсудить разницу «нужно/хочу»');
  if(s.st.fines)flags.push('⚖️ Штрафы в игре: '+fmt(s.st.fines)+' — повод обсудить, почему честность выгоднее');
  if(s.loan)flags.push('💸 Взял микрозайм в игре — хороший повод поговорить о кредитах');
  if(st.scam>0)flags.push('🛡️ Распознал мошенников '+st.scam+' раз(а)');
  if(tot>=5&&wp>=75)flags.push('🌟 Отличное финансовое мышление');
  return `<div class="card"><div class="row"><span class="big">${s.a}</span><div style="flex:1"><b style="font-size:18px">${esc(s.n)}</b><br><small>${LEVELS[L][2]} ${LEVELS[L][1]} · неделя ${s.w} · ${p?'на этом устройстве':'отчёт от '+new Date(s.t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></div>
  <div class="cap" style="font-size:24px;margin:10px 0 0">${fmt(s.nw)}</div><small>капитал · наличные ${fmt(s.cash)} · банк ${fmt(s.bank)}</small>
  ${spark(s.h)}
  <div class="grid3" style="margin:10px 0">
   <div class="stat"><b>${tot?wp+'%':'—'}</b><small>разумных решений (${st.wise}/${tot})</small></div>
   <div class="stat"><b>${st.qt?Math.round(st.qc/st.qt*100)+'%':'—'}</b><small>викторина (${st.qc}/${st.qt})</small></div>
   <div class="stat"><b>${st.ch}</b><small>дел выполнено</small></div>
   <div class="stat"><b>${st.imp}</b><small>импульсивных покупок</small></div>
   <div class="stat"><b>${st.resist}</b><small>отказов от лишнего</small></div>
   <div class="stat"><b>${s.ach.length}/${ACH.length}</b><small>достижений</small></div></div>
  <p style="font-size:14px">📖 Книга: прочитано глав <b>${s.bk||0} из ${BOOK.length}</b></p>
  ${flags.map(f=>`<div class="lesson" style="margin-top:6px;font-size:14px">${f}</div>`).join('')}
  ${s.goals.length?`<p style="margin-top:10px"><b>Цели:</b> ${s.goals.map(g=>`${g[0]} ${esc(g[1])} ${g[4]?'✅':Math.round(g[2]/g[3]*100)+'%'}`).join(' · ')}</p>`:''}
  ${s.biz.length?`<p><b>Бизнесы:</b> ${s.biz.map(b=>`${b[0]} ${b[1]} (ур. ${b[2]})`).join(' · ')}</p>`:''}
  <details style="margin-top:8px"><summary class="mut">Последние операции</summary>${s.log.map(l=>`<div class="logl"><span><small>Нед. ${l.w}</small> ${esc(l.t)}</span>${l.a?`<b class="${l.a>0?'pos':'neg'}">${sgn(l.a)}</b>`:''}</div>`).join('')}</details>
  ${p?pControls(p):`<button class="btn sm ghost" style="margin-top:10px" onclick="delReport('${s.id}')">Удалить отчёт</button>`}</div>`;
}
function pControls(p){
  const wait=p.ptasks.filter(t=>t.status==='done'),open=p.ptasks.filter(t=>t.status==='open');
  return `<div style="border-top:2px dashed var(--line);margin-top:12px;padding-top:12px">
   <b>⚙️ Настройки</b>
   <div class="row" style="margin:8px 0"><span style="flex:1;font-size:14px">Карманные деньги в неделю:</span><input id="pk_${p.id}" class="inp" type="number" inputmode="numeric" value="${p.pocket}" style="width:110px;padding:8px"><button class="btn sm" onclick="setPocket('${p.id}')">OK</button></div>
   <b style="display:block;margin-top:10px">🏠 Настоящие задания</b><small>Ребёнок отмечает выполнение, вы подтверждаете — и деньги начисляются в игре.</small>
   ${wait.map(t=>`<div class="row between" style="margin-top:8px;background:#FFF1D6;padding:8px;border-radius:12px"><span>⏳ ${esc(t.title)} · ${fmt(t.reward)}</span><span class="row"><button class="btn sm" onclick="ptApprove('${p.id}','${t.id}')">✓</button><button class="btn sm ghost" onclick="ptReject('${p.id}','${t.id}')">✕</button></span></div>`).join('')}
   ${open.map(t=>`<div class="row between" style="margin-top:6px;font-size:14px"><span>📌 ${esc(t.title)} · ${fmt(t.reward)}</span><button class="btn sm ghost" onclick="ptDel('${p.id}','${t.id}')">Удалить</button></div>`).join('')}
   <div class="row" style="margin-top:8px"><input id="tt_${p.id}" class="inp" placeholder="Например: выучить стих" style="padding:9px"><input id="tr_${p.id}" class="inp" type="number" inputmode="numeric" placeholder="сом" style="width:90px;padding:9px"><button class="btn sm" onclick="ptAdd('${p.id}')">+</button></div>
   <button class="btn sm red" style="margin-top:12px" onclick="delProfile('${p.id}')">Удалить игрока</button></div>`;
}
function vParent(){
  if(!PARENT_OK){VIEW='profiles';return vProfiles();}
  const loc=S.order.map(id=>S.profiles[id]).filter(Boolean);
  const reps=Object.values(S.reports).sort((a,b)=>b.t-a.t);
  return `<div class="row between" style="margin:6px 0 14px"><h2 style="margin:0">👨‍👩‍👧 Родительский кабинет</h2><button class="btn sm ghost" onclick="PARENT_OK=false;go('profiles')">Выйти</button></div>
  <div class="info">Здесь видно, <b>как</b> ребёнок принимает решения, а не только сколько «заработал». Если дети играют на своих телефонах — попросите их нажать «Отправить отчёт родителям» (вкладка «Я») и вставьте код ниже.</div>
  <h3 class="sec">На этом устройстве</h3>
  ${loc.length?loc.map(p=>pCard(summ(p),p)).join(''):'<div class="card mut">Игроков на этом устройстве нет.</div>'}
  <h3 class="sec">Отчёты с других устройств</h3>
  ${reps.length?reps.map(s=>pCard(s,null)).join(''):'<div class="card mut">Отчётов пока нет.</div>'}
  <div class="card"><b>📥 Добавить отчёт по коду</b><textarea id="imp" class="inp" placeholder="Вставьте код, начинающийся с МПМ:" style="margin:10px 0"></textarea><button class="btn wide" onclick="importReport()">Добавить</button></div>
  <button class="btn ghost wide" onclick="changePin()">🔑 Сменить PIN</button>
  <p class="mut" style="text-align:center;font-size:13px;margin:14px 0 6px">Вход выполнен: <b>${esc(S.auth.login)}</b></p>
  <button class="btn ghost wide" onclick="logout()">🚪 Выйти на этом устройстве</button>`;
}
function importReport(){
  let v=($('imp').value||'').trim();const m=v.match(/МПМ:([A-Za-z0-9+/=]+)/);
  if(!m){toast('Код не распознан');return;}
  try{const s=JSON.parse(b64d(m[1]));if(!s.id||!s.st)throw 0;S.reports[s.id]=s;save();toast('Отчёт игрока '+s.n+' добавлен ✅');render();}catch(e){toast('Код повреждён — попросите отправить заново');}
}
function delReport(id){askConfirm('Удалить этот отчёт?',()=>{delete S.reports[id];save();render();});}
function setPocket(id){const v=Math.max(0,Math.min(100000,Math.floor(Number($('pk_'+id).value)||0)));S.profiles[id].pocket=v;save();toast('Карманные деньги: '+fmt(v)+' в неделю');render();}
function ptAdd(id){const t=($('tt_'+id).value||'').trim(),r=Math.floor(Number($('tr_'+id).value));if(!t||!(r>0)){toast('Введите задание и награду');return;}S.profiles[id].ptasks.push({id:uid(),title:t,reward:r,status:'open'});save();toast('Задание добавлено');render();}
function ptApprove(pid,tid){const p=S.profiles[pid],t=p.ptasks.find(x=>x.id===tid);t.status='approved';earn(p,t.reward,'🏠 Задание родителей: '+t.title);p.st.real++;p.xp+=30;p.ptasks=p.ptasks.filter(x=>x.status!=='approved').concat([]);save();toast('Подтверждено, '+fmt(t.reward)+' начислено');render();}
function ptReject(pid,tid){const t=S.profiles[pid].ptasks.find(x=>x.id===tid);t.status='open';save();render();}
function ptDel(pid,tid){const p=S.profiles[pid];p.ptasks=p.ptasks.filter(x=>x.id!==tid);save();render();}
function delProfile(id){askConfirm('Удалить игрока «'+S.profiles[id].name+'» и весь его прогресс?',()=>{delete S.profiles[id];S.order=S.order.filter(x=>x!==id);if(S.cur===id)S.cur=null;save();render();});}
function changePin(){modal(`<h2>🔑 Новый PIN</h2><input id="pin" class="inp pin" type="password" inputmode="numeric" maxlength="4" style="margin:14px 0"><button class="btn wide" onclick="setPin()">Сохранить</button>`);}

/* =================== СТАРТ =================== */
if(S.cur&&S.profiles[S.cur]){VIEW='game';}
render();
</script>
</body>
</html>
